name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write # only needed to commit the regenerated sections

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public repositories and activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update-projects.py

      - name: Commit only when something changed
        run: |
          git add -A -- README.md README.es.md assets/cards/repos assets/statistics
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public projects and activity"
          git push
